# gen 指令生成器：Python FastAPI + LangGraph，一问一答写主人交易指令
# 单独一个 compose 项目，主文件的 up -d --build 不会碰它：docker compose -f gen-compose.yml up -d --build
# 与三个 Java 服务共用外部 wiib-network，靠容器名寻址 wiib-sim / wiib-agent
# nginx 那边加一段（配置在服务器上，不在仓里）：
#   location /api/gen/ { proxy_pass http://127.0.0.1:8083; proxy_buffering off; }

name: wiib-gen

x-svc-base: &svc-base
  restart: unless-stopped
  env_file:
    - .env
  ulimits:
    nproc: 16384
    nofile: 65536
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  wiib-gen:
    <<: *svc-base
    build: { context: ./wiib-gen, dockerfile: Dockerfile }
    container_name: wiib-gen
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./wiib-gen/data:/data    # checkpoint + 线程归属表的 sqlite
    environment:
      TZ: ${TZ:-Asia/Singapore}
      GEN_DB_PATH: /data/gen.sqlite
      SIM_BASE_URL: http://wiib-sim:8080
      AGENT_BASE_URL: http://wiib-agent:8082
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: "1"

networks:
  default:
    name: wiib-network
    external: true
