# ============================================================
# WhatIfIBought 五服务部署 (feed / sim / agent / gen / alpha)
#   1. 建 .env（cp .env.example 填值，HOST 填法见 .env.example 注释）
#   2. mvn clean package -pl wiib-feed,wiib-agent,wiib-sim -am -DskipTests
#      wiib-quant 是 agent 依赖的库，-am 会带上，不用单列
#      wiib-gen / wiib-alpha 是 Python，不进 mvn，依赖由镜像里的 uv 装
#   3. docker compose up -d --build
#
# 配置只改 .env，本文件不含任何环境私有值，直接入库。
# env_file 把 .env 全量注入容器，application.yml 占位符自行解析，
# 无需再做 SPRING_* 环境变量映射；端口已固定在各模块 yml 里。
# x-* 为复用锚点，<<: 合并到各服务。
# ============================================================

x-svc-base: &svc-base
  restart: unless-stopped
  env_file:
    - .env
  ulimits:
    nproc: 16384
    nofile: 65536
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

x-shared-env: &shared-env
  TZ: ${TZ:-Asia/Singapore}

services:
  wiib-feed:
    <<: *svc-base
    build: { context: ./wiib-feed, dockerfile: Dockerfile }
    container_name: wiib-feed
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./dumps/feed:/dumps      # 各服务独立子目录，避免 PID=1 dump 重名
    environment:
      <<: *shared-env
    mem_limit: 3584m
    mem_reservation: 1g
    cpus: "2"

  wiib-sim:
    <<: *svc-base
    build: { context: ./wiib-sim, dockerfile: Dockerfile }
    container_name: wiib-sim
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dumps/sim:/dumps
    environment:
      <<: *shared-env
      # 容器间用服务名寻址，覆盖 yml 里的 localhost 默认
      FEED_INTERNAL_BASE_URL: http://wiib-feed:8081
    mem_limit: 5632m
    mem_reservation: 2g
    cpus: "3"

  wiib-agent:
    <<: *svc-base
    build: { context: ./wiib-agent, dockerfile: Dockerfile }
    container_name: wiib-agent
    ports:
      # 宿主 8082 已被占用，宿主侧映射 18082（nginx 反代 agent 路径用它；容器间仍走 wiib-agent:8082 可自行调整）
      - "127.0.0.1:18082:8082"
#      - "127.0.0.1:8082:8082"
    volumes:
      - ./dumps/agent:/dumps
    environment:
      <<: *shared-env
      SIM_INTERNAL_BASE_URL: http://wiib-sim:8080
    mem_limit: 6144m
    mem_reservation: 2g
    cpus: "3"

  # gen 指令生成器：Python FastAPI + LangGraph，一问一答写主人交易指令
  # nginx 那边加一段（配置在服务器上，不在仓里）：
  #   location /api/gen/ { proxy_pass http://127.0.0.1:8083; proxy_buffering off; }
  wiib-gen:
    <<: *svc-base
    build: { context: ./wiib-gen, dockerfile: Dockerfile }
    container_name: wiib-gen
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./wiib-gen/data:/data    # checkpoint + 线程归属表的 sqlite
    environment:
      <<: *shared-env
      GEN_DB_PATH: /data/gen.sqlite
      SIM_BASE_URL: http://wiib-sim:8080
      AGENT_BASE_URL: http://wiib-agent:8082
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: "1"

  # alpha 因子挖掘：Python FastAPI + LangGraph，LLM 提假设写 DSL、代码硬门判真假，只有管理员能用
  # 模型走 .env 的 ALPHA_GEN_* / ALPHA_REVIEW_*，行情直连 Binance 合约接口（服务器所在地区得能访问）
  # nginx 那边加一段（配置在服务器上，不在仓里）：
  #   location /api/alpha/ { proxy_pass http://127.0.0.1:8084; proxy_buffering off; }
  wiib-alpha:
    <<: *svc-base
    build: { context: ./wiib-alpha, dockerfile: Dockerfile }
    container_name: wiib-alpha
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - ./wiib-alpha/data:/data    # 行情 parquet + checkpoint 与因子库的 sqlite
    environment:
      <<: *shared-env
      ALPHA_DATA_DIR: /data
      ALPHA_DB_PATH: /data/alpha.sqlite
      SIM_BASE_URL: http://wiib-sim:8080
    mem_limit: 4096m
    mem_reservation: 512m
    cpus: "2"

networks:
  default:
    name: wiib-network
    external: true
